[project]
name = "jeanclaude"
version = "0.1.0"
description = "Mini hedge fund — quantitative multi-asset management framework"
authors = [
    { name = "Emanuele" },
    { name = "Filippo" },
]
requires-python = ">=3.10,<3.14"
dependencies = [
    # Core data
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "pyarrow>=17.0,<18",
    # Portfolio optimization
    "scipy>=1.14,<2",
    "cvxpy>=1.5,<2",
    # ML / Signals
    "torch~=2.2",
    "pomegranate>=1.0,<2",
    "scikit-learn>=1.5,<2",
    # Data ingestion
    "fredapi>=0.5,<1",
    "yfinance>=0.2,<1",
    "python-dotenv>=1.2.2,<2",
    "lseg-data>=2.1.1,<3",
    "jinja2>=3.1,<4",
    "matplotlib>=3.9,<4",
    "statsmodels>=0.14,<1",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
news = ["transformers>=4.44,<5"]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jeanclaude"]
